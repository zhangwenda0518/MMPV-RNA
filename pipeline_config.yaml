# ==============================================================================
# MMPV = Massive Meta-mining of Plant Viruses — 管道配置文件
# ==============================================================================
# 【I/O 目录布局】(v3.1 新增; 不写 = standard 默认)
#   ⚠ 本文件中的 io_layout 键是**说明性文档, 写入不生效** (2026-10-13 核实:
#     无代码从 YAML 读该键)。实际切换用环境变量 MMPV_IO_LAYOUT=legacy 或
#     各编排器 --io-layout legacy (优先级 CLI > 环境变量 > standard 默认)。
#   standard = 管线独立根布局 (默认; 01_PublicData/02_Preprocessing/03_Discovery/
#              04_Analysis/05_Phylo/06_EVE, 根内各自独立编号)
#   legacy   = 现行目录名 (00a_CleanData/02a_Identification/09a_Virome_Analysis/...;
#              存量项目/checkpoint 兼容用, 需显式指定)
#   完整规范与 legacy↔standard 映射表见 doc/IO_LAYOUT_DESIGN.md
#
# 用法:
#   python virome_pipeline.py --profile default --output_dir out/
#   python virome_pipeline.py --config my_config.yaml --profile plant
#   python virome_pipeline.py --profile default --output_dir out/ --threads 120
#     (CLI 参数覆盖配置文件, 优先级: CLI > profile > default)
#
# 【换环境怎么改】路径支持 ${环境变量:-默认值}，无需改本文件：
#   MMPV_DB_ROOT      数据库根（默认 /home/zhangwenda/database）← 覆盖它即可迁移整批数据库
#   MMPV_HOST_DB      宿主库根（默认 {MMPV_DB_ROOT}/host_db/）
#   MMPV_VIRUS_DB     病毒库根（默认 {MMPV_DB_ROOT}/virus-db/）
#   MMPV_KRAKEN2_DB   Kraken2 宿主库
#   MMPV_CHECKV_DB    CheckV 数据库
#   MMPV_PLANT_VIRUS_DB  植物病毒参考库根（默认 /home/zhangwenda/plant_virus_db）
#   MMPV_SALMON / MMPV_DIAMOND / MMPV_RAGTAG / MMPV_VIRBOT  工具可执行文件
#   MMPV_EVE_REF_DB / MMPV_EVE_PV_DB / MMPV_EVE_ID2DIV / MMPV_EVE_RVDB_DB
#                         EVE 筛查四库（默认见 databases.eve_* 行）
# 例: MMPV_DB_ROOT=/data/db python virome_pipeline.py --profile plant ...
#
# 【profile 继承】plant/downstream 用 YAML 锚点继承 default，只写差异项；
#   新增 profile 请同样继承，避免复制导致配置漂移（历史问题：plant 曾缺
#   deplete.* / tools.ragtag / taxonomy.* 等 10 个键）。
# ==============================================================================

profiles:

  # ── 默认配置 (通用) ──
  default: &default
    databases: &db_default
      db_dir:            ${MMPV_VIRUS_DB:-${MMPV_DB_ROOT:-/home/zhangwenda/database}/virus-db}/
      virus_db:          ${MMPV_VIRUS_DB:-${MMPV_DB_ROOT:-/home/zhangwenda/database}/virus-db}/
      # -- 鉴定工具数据库 --
      genomad_db:        ${MMPV_VIRUS_DB:-${MMPV_DB_ROOT:-/home/zhangwenda/database}/virus-db}/genomad_db/
      virus_protein_db:  ${MMPV_VIRUS_DB:-${MMPV_DB_ROOT:-/home/zhangwenda/database}/virus-db}/RVDB-v31/RVDB_viroids.diamond_db/U-RVDBv31.0-prot_unique.dmnd
      uniprot_db:        ${MMPV_DB_ROOT:-/home/zhangwenda/database}/uniport_db/uniref90/uniref90.dmnd
      nr_db:             ${MMPV_DB_ROOT:-/home/zhangwenda/database}/nr_db/nr.dmnd              # 待构建: diamond makedb --in nr.fa -d nr.dmnd
      virsorter_db:      ${MMPV_VIRUS_DB:-${MMPV_DB_ROOT:-/home/zhangwenda/database}/virus-db}/virsorter2_db
      viralverify_hmm:   ${MMPV_VIRUS_DB:-${MMPV_DB_ROOT:-/home/zhangwenda/database}/virus-db}/viralverify_db/nbc_hmms.hmm
      metabuli_db:       ${MMPV_VIRUS_DB:-${MMPV_DB_ROOT:-/home/zhangwenda/database}/virus-db}/RVDB-v31/RVDB_viroids.metabuli_db
      viroids_db:        ${MMPV_VIRUS_DB:-${MMPV_DB_ROOT:-/home/zhangwenda/database}/virus-db}/viroids-db/viroids.fasta
      # -- 内源性病毒 (EVE) 筛查数据库 --
      # 【⑥ endogenous_virus_pipeline 已归档 2026-10-11 →
      #   archive/20261011_endogenous_virus_pipeline; 配置保留, 恢复即用】
      eve_ref_db:        ${MMPV_EVE_REF_DB:-${MMPV_VIRUS_DB:-${MMPV_DB_ROOT:-/home/zhangwenda/database}/virus-db}/ncbi-virus_ref/ncbi-virus_ref.pep.dmnd}
      eve_pv_db:         ${MMPV_EVE_PV_DB:-${MMPV_DB_ROOT:-/home/zhangwenda/database}/uniport_db/hybrid/plant_virus_final.dmnd}
      eve_id2div:        ${MMPV_EVE_ID2DIV:-${MMPV_DB_ROOT:-/home/zhangwenda/database}/uniport_db/hybrid/id2div_final.tsv}
      eve_rvdb_db:       ${MMPV_EVE_RVDB_DB:-${MMPV_VIRUS_DB:-${MMPV_DB_ROOT:-/home/zhangwenda/database}/virus-db}/RVDB-v31/U-RVDBv31.0-prot.EX.acc.tax2.dmnd}
      # -- 分类 / 聚类 / 宿主数据库 --
      mmseqs_db:         ${MMPV_VIRUS_DB:-${MMPV_DB_ROOT:-/home/zhangwenda/database}/virus-db}/RVDB-30/RVDB.mmseqs
      blast_db:          ${MMPV_VIRUS_DB:-${MMPV_DB_ROOT:-/home/zhangwenda/database}/virus-db}/ncbi-virus_ref/ncbi-virus_ref.blast.db
      host_db:           ${MMPV_HOST_DB:-${MMPV_DB_ROOT:-/home/zhangwenda/database}/host_db}/
      checkv_threshold: 90

    tools: &tools_default
      salmon:   ${MMPV_SALMON:-~/MMPV-RNA/biosoft/salmon-2.5.1/bin/salmon}
      diamond:  ${MMPV_DIAMOND:-/home/zhangwenda/biosoft/binary/diamond}
      samtools: ${MMPV_SAMTOOLS:-}   # EVE 抽序列 (samtools faidx); 空 = 用 PATH
      ragtag:   ${MMPV_RAGTAG:-~/mambaforge/bin/ragtag.py}
      virbot:   ${MMPV_VIRBOT:-/home/zhangwenda/biosoft/virus/VirBot/VirBot.py}

    runtime: &runtime_default
      threads:  60
      jobs:     10
      tax_jobs: 4

    deplete: &deplete_default
      # 已接线 (2026-10-26): virome_pipeline.py 的 _load_config() 把本段映射到
      #   --kraken2_db / --classifier / --keep_taxids / --kraken2_confidence / --vmtouch。
      #   优先级: CLI 显式参数 > 本段 > argparse 默认值。
      #   下列值与 argparse 默认完全一致 (kraken2 / 10239 / false / 0.2), 故默认行为不变;
      #   换环境/换库改这里即可, 不必每次敲 CLI。
      # 空 = 不覆盖: 默认流程用 host_db 下自建宿主库
      #   (host_db 内 kraken2/kunpeng/kraken2_db/kraken 子目录自动探测)。
      #   仅当缺分类库会报致命错误、或要整体换库时才填具体路径, 例:
      #   ${MMPV_KRAKEN2_DB:-/home/zhangwenda/database/kraken2/k2_pluspfp_20260226}
      kraken2_db:   ${MMPV_KRAKEN2_DB:-}
      classifier:   kraken2  # kraken2 / kunpeng; kunpeng 需 kun_peng 可执行文件, 首次会自动 hashshard 库
      # kunpeng_bin: kun_peng                 # 或绝对路径 / 由 MMPV_KUNPENG_BIN 指定
      # kunpeng_hash_capacity: 1G             # hashshard 分片容量 (1G ≈ 4GiB/片)
      # min_hit_groups: 2                     # Kun-peng 最小 hit group 数
      keep_taxids:  10239    # 从分类 classified 池中救回病毒 reads (整数自动转 '10239'); 设空字符串关闭
      vmtouch:      false    # 将分类库锁定到 page cache 加速 I/O
      confidence:   0.2      # 分类置信度阈值 (默认: 0.2)
      # 以下键同样已接线, 默认不写 (= 沿用 argparse 默认), 需要时取消注释:
      # keep_rrna:        false   # 保留 rRNA reads (跳过 ribodetector)
      # rrna_chunk_size:  256
      # rrna_report:      ribodetector.report.txt
      # deplete_steps:    kraken2,align,rrna
      # align_config:     ''      # 宿主比对参考配置文件 (空 = 用子脚本默认)
      # deplete_debug:    false
      # tmp:              ''      # 去宿主中间目录 (空 = 子脚本默认)

    assembly: &assembly_default
      assembler: megahit

    identification: &identification_default
      virus_mode: filter
      blast_mode: both

    cobra:
      cobra_jobs: 0               # 0=自动 (jobs//2), >0 显式指定

    cluster: &cluster_default
      min_length: 500
      ani: 0.95
      qcov: 0.85
      ref_genomes:
        - ${MMPV_PLANT_VIRUS_DB:-/home/zhangwenda/plant_virus_db}/3.final-ref-virus.db/final.complete_ref.fasta
        - ${MMPV_VIRUS_DB:-${MMPV_DB_ROOT:-/home/zhangwenda/database}/virus-db}/ncbi-virus_ref/viral.1.1.genomic.fna

    taxonomy:
      tax_sample_name: Votus  # 分类输出样本名

    host:
      host_mode: all               # all / ICTV / RNAVirHost / PhaBOX2
      host_filter:
        - Plant

    rescue: &rescue_default
      checkv_threshold: 90
      max_vsi_samples: 10
      min_vsi_len:     2000

    # 组装图标签传播 (③ graph 阶段, virome_discovery_pipeline/graph_propagation.py;
    # CLI 可覆盖, --skip-graph 等同 enabled: false)
    # 思想源自 GMW (Chen et al. 2026, Sci China Life Sci 69:1910): 配对读段链接图 +
    # ensemble 种子 + Louvain 社区传播, 重估 contig 的 viral/non-viral 归属。
    graph:
      enabled:          false   # 默认不运行 (2026-10-07 用户裁定); 开启方式: 改 true,
                                # 或 CLI --graph-enabled (2026-10-13 新增; graph 是
                                # filter 子步骤, 无独立 --stage graph), filter/COBRA 自动回退纯过滤结果
      min_link_pairs:   3       # 建边所需最少跨 contig 配对读段数
      gc_diff:          0.20    # 断边 GC 差阈值 (GMW 口径)
      depth_ratio:      20.0    # 断边深度比阈值 (GMW 口径)
      require_proper:   false   # 仅收 proper pair; 必须保持 false — bwa 的 0x2 只在
                                # 同 contig 时置位, 开启=零跨 contig 链接 (246 实测)
      resolution:       1.0     # Louvain 分辨率 (GMW 论文用 2; 默认更保守)
      seed_min_votes:   2       # 病毒种子最少工具票数 (默认 2; 弱阳性票数<阈值归 unknown
                                #  交图传播裁决 — 设 1 会使降级/救回两个消费点失效)
      nonviral_min_len: 1000    # 非病毒种子最短长度 (= 鉴定阶段 LEN_VIRUS_MIN)
      majority_ratio:   10.0    # 社区传播多数比 (GMW >=10 倍规则)
      apply_to_filter:  true    # filter 末端消费判定 (救回/降级; 审计表逐样本可查)
      apply_to_cobra:   true    # COBRA raw 候选源切到派生目录 (剔除降级 contig)
      graph_jobs:       0       # 并行样本数; 0 = 自动 (jobs/2)
      max_reads:        0       # >0 每端取前 N 条 (确定性前缀截取, 规模兜底)
      map_min_len:      1000    # 映射参考只保留 >= 该长度的 contigs (0=全量);
                                # 短 contig 无可执行判定, 1000 可省 30-60% 映射时间

    # 内源性病毒 (EVE) 筛查参数 (⑥ 已于 2026-10-11 移出主流水线并归档 →
    # archive/20261011_endogenous_virus_pipeline; 参数保留, 恢复即用)
    # 接线状态 (2026-10-26 核实):
    #   主控 virome_pipeline.py 的 _load_config() **不读本段** —— 主流水线当前没有 EVE
    #   阶段, 改这里不影响 --stage all 的任何环节。
    #   实际消费方是 EVE 筛查编排器 eve_screen.py (现役 public_metadata_pipeline/
    #   eve_genome/, 归档副本 archive/20261011_endogenous_virus_pipeline/): 其
    #   _load_config() 按 --profile 读本段, 把 EVE_PARAM_KEYS (window / merge_distance /
    #   evalue / host_bs / viral_bs / cmd_timeout) 映射到 --window / --merge-distance /
    #   --evalue / --host-bs / --viral-bs / --cmd-timeout, 优先级 CLI > 本段 > 默认值。
    #   => 单独跑 EVE 筛查时本段有效; 要并入主流水线, 需在主控新增 EVE 阶段调用
    #      eve_screen.py (或照 deplete 段的 _cli_set 写法在主控 _load_config 里接线)。
    eve:
      window:         50000   # Stage1 滑窗宽度 (nt)
      merge_distance: 300     # 位点合并间隔 (nt)
      evalue:         "1e-5"  # blastx e-value
      host_bs:        50      # Stage2 植物侧判定阈值 (bitscore)
      viral_bs:       50      # Stage2 病毒侧判定阈值 (bitscore)
      cmd_timeout:    0       # 单条外部命令超时 (秒); 0=不限 (防工具挂死占核)

  # ── 仅下游阶段 (已有 clusters, 跳过 00-03) ──
  downstream:
    <<: *default  # 继承 default 配置 (需 PyYAML merge, 也可直接复制)
    # 阶段跳过开关已接线 (2026-10-26): _load_config() 把这 4 个键收进
    #   args.skip_stages, main() 在 --stage 含 all 时按 STAGE_ORDER 展开再剔除。
    #   => --profile downstream 等价于 --stage filter cobra merge cluster taxonomy
    #      host checkv rescue analysis analysis_verify report (跳过 clean/deplete/
    #      assembly/identification)。
    #   显式 --stage 不受影响 (--stage cluster 仍只跑 cluster); 值改 false 或删键
    #   即恢复对应阶段。
    #   注: 本文件 YAML merge 是浅合并, 故下面 assembly/identification 用锚点
    #   补齐 default 的差异项 (否则会丢掉 assembler/virus_mode/blast_mode)。

    cleanup:
      skip_clean:      true   # 跳过 00a CleanData
      skip_depletion:  true   # 跳过 00b HostDepletion

    assembly:
      <<: *assembly_default
      skip_assembly:        true   # 跳过 01 Assembly

    identification:
      <<: *identification_default
      skip_identification:  true   # 跳过 02a 鉴定

  # ── 植物病毒专用 (高灵敏度) ──
  # 只写与 default 的差异；其余（deplete/tools/taxonomy/cobra/rescue/host_filter 等）自动继承
  plant:
    <<: *default

    databases:
      <<: *db_default
      checkv_db: ${MMPV_CHECKV_DB:-${MMPV_DB_ROOT:-/home/zhangwenda/database}/virus-db}/checkv-db-v1.7

    runtime:
      <<: *runtime_default
      tax_jobs: 8

    assembly:
      assembler: rnaviralspades

    cluster:
      <<: *cluster_default
      min_length: 300
      qcov: 0.80
      ref_genomes:
        - ${MMPV_PLANT_VIRUS_DB:-/home/zhangwenda/plant_virus_db}/3.final-ref-virus.db/final.complete_ref.fasta

  # ── 已知病毒分析管线 (auto_known_virus.py) ──
  analysis:
    runtime:
      threads: 60
      jobs: 4
      align_threads: 8

    detect:
      tool: salmon
      batch_size: 20
      coverage: 10.0
      ratio: 0.3
      meandepth: 0.5
      min_tpm: 1.0
      min_uniq_reads: 10
      sp_thresh: 95.0
      use_coverm: false
      min_aln_len: 80
      min_aln_prop: 0.85
      min_pid: 0.90
      single_end: false

    filter:
      enabled: true
      filter_cov: 50.0
      filter_depth: 5.0
      filter_reads: 100.0

    variants:
      variant_caller: ivar
      snpeff: true
      snpgenie: true
      vc_qual: 20
      vc_depth: 5
      vc_freq: 0.5

    assembly:
      assembly_tools: all
      min_covered: 10.0
      extra_args: "--iter 3 --vc-min-depth 1"
      iter: 3

    extract:
      extract_target: "11.Ultimate_Circular_Result.fasta"
      max_n_genome: 5.0
      min_length: 150

    post:
      post_min_dp: 50
      post_min_af: 0.05

    capheine:
      capheine_code: "1"

    similarity:
      sim_mode: filter
      sim_cdhit: false

    dvg:
      dvg_seed: 25
      dvg_mindel: 15
      dvg_min_cov: 80.0

    report:
      report_ai: false
