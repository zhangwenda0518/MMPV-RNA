# ==============================================================================
# MMPV-RNA v2.3 — pixi 环境配置
# ==============================================================================
# 安装: pixi install
# 激活: pixi shell
# 运行: pixi run <task>
#
# 手动安装的工具见下方 [tool.manual] 章节
# ==============================================================================

[project]
name = "MMPV-RNA"
version = "2.3.0"
description = "Macro-metagenomic Plant Virome RNA pipeline — discovery + analysis + public data"
authors = ["zhangwenda"]
channels = ["conda-forge", "bioconda", "nodefaults"]
platforms = ["linux-64"]

# ==============================================================================
# 核心依赖 — 所有流程共用
# ==============================================================================
[dependencies]
# --- 语言运行时 ---
python = ">=3.10,<3.11"                        # 3.10 上限: ribodetector 锁 py<=3.10, rdrpcatch 等走独立 env
r-base = ">=4.2,<4.5"                          # conda 包名是 r-base (无 R 别名包)
perl = ">=5.32"
openjdk = ">=21"                               # SnpEff 需要 JRE>=21; conda 包名 openjdk (java-openjdk 不存在)

# --- Python 核心库 ---
biopython = ">=1.83"
pandas = ">=2.0,<3"
numpy = ">=1.24,<3"
matplotlib = ">=3.7"
seaborn = ">=0.12"
polars = ">=0.20"
pysam = ">=0.22"
plotly = ">=5.14,<6"
python-kaleido = ">=0.2,<0.3"                      # plotly 静态导出 (conda-forge 包名 python-kaleido)
scipy = ">=1.10"
scikit-learn = ">=1.3"                        # PCA/KMeans (variants/SnpGenie)
requests = ">=2.28"
tqdm = ">=4.65"
psutil = ">=5.9"
colorlog = ">=6.7"
xmltodict = ">=0.13"
openai = ">=1.0"
urllib3 = ">=2.0"
upsetplot = ">=0.8"
venn = ">=0.1"                                # 韦恩图 (virus_identification)
networkx = ">=3.0"                            # 单倍型网络 (haplotype/build_haplo)
openpyxl = ">=3.1"                            # 读 xlsx (元数据/VMR 表)
pyhmmer = ">=0.10"                            # HMMER 蛋白域搜索

# --- GUI (metadata_gui / submission_gui / virome_submission_pipeline/submission_gui.py) ---
pyside6 = ">=6.5"

# --- 系统发育辅助 (virome_phylo_pipeline Python 侧) ---
treetime = ">=0.9"                            # RTT 定年门禁
cartopy = ">=0.22"                            # 地图可视化 (sample_plot)
geopy = ">=2.4"                               # 地理坐标 (virphy_bridge)
marsilea = ">=0.4"                            # 复合图 (pub_plots)

# --- R 核心包 (CRAN) ---
r-optparse = ">=1.7"
"r-data.table" = ">=1.14"
r-ggplot2 = ">=3.4"
r-venndiagram = ">=1.7"
r-ggvenndiagram = ">=1.5"
r-stringr = ">=1.5"
r-rcolorbrewer = ">=1.1"
r-scales = ">=1.2"
r-cowplot = ">=1.1"
r-patchwork = ">=1.1"
r-parallelly = ">=1.36"
r-ggrepel = ">=0.9"
r-dplyr = ">=1.1"
r-tidyr = ">=1.3"
r-circlize = ">=0.4"
r-httr = ">=1.4"
r-viridis = ">=0.6"
r-upsetr = ">=1.4"
r-gridextra = ">=2.3"
r-ape = ">=5.7"                               # 系统发育 (popgen_r_backend.R)
r-pegas = ">=1.2"                             # 群体遗传 (popgen_r_backend.R)
r-ggpubr = ">=0.6"                            # 统计标注 (panvirome_suite.R)
r-zoo = ">=1.8"                               # 滑窗 (panvirome_suite.R)
r-fs = ">=1.6"                                # 文件操作 (panvirome_suite.R)

# --- R Bioconductor ---
bioconductor-maftools = ">=2.18"
bioconductor-complexheatmap = ">=2.18"        # oncoprint 热图 (panvirome_oncoprint.R)

# ==============================================================================
# 数据清洗 & 宿主去除 (Stage 0a-0c)
# ==============================================================================
fastp = ">=0.23"                              # QC + trimming
seqkit = ">=2.6"                              # FASTA/Q 操作
seqtk = ">=1.4"                               # subseq 提取
bbmap = ">=39.0"                              # BBNorm, clumpify, bbmap
bedtools = ">=2.31"                           # getfasta (Virseqimprover VSI 拯救)
bowtie2 = ">=2.5"                             # 宿主比对
hisat2 = ">=2.2"                              # 宿主比对 (splice-aware)
minimap2 = ">=2.24"                           # 长读段比对
kraken2 = ">=2.1"                             # 宿主分类去除
ribodetector = ">=0.3"                        # rRNA 检测去除

# ==============================================================================
# 组装 (Stage 1: Assembly)
# ==============================================================================
# 注意: penguin / refinec / flye 为源码自编译安装 (bioconda 无包), 见文末手动安装区
megahit = ">=1.2"                             # 宏基因组组装
spades = ">=3.15"                             # (含 rnaviralspades.py)
bioawk = ">=1.0"                              # rnaviralspades 依赖

# ==============================================================================
# 病毒鉴定 (Stage 2: Identification)
# ==============================================================================
# 注意: VirHunter / VirBot / ViraLM 走独立 conda env (virhunter/viralm) + biosoft 手动拷贝
#       (bioconda 无包), 见文末手动安装区
diamond = ">=2.1"                             # BLASTX 蛋白搜索
blast = ">=2.15"                              # BLASTN 核酸搜索
genomad = ">=1.7"                             # 病毒鉴定 (geNomad)
# virsorter bioconda 构建锁死旧 ruamel.yaml(py<3.10), 独立 env 部署: conda create -n vs2 virsorter=2.2.4                             # 病毒分类 (VirSorter2)
viralverify = ">=1.0"                         # 病毒序列验证
metabuli = ">=1.0"                            # 宏基因组分类
# rdrpcatch 独立 env 部署 (代码用 conda run -n rdrpcatch): conda create -n rdrpcatch rdrpcatch                           # RdRp 检测 (conda run -n rdrpcatch)
checkv = ">=1.0"                              # 完整性评估 (discovery-downstream 默认依赖)

# ==============================================================================
# 病毒分类 (Stage 5: Taxonomy — 6 工具)
# ==============================================================================
mmseqs2 = ">=14"                              # 快速分类搜索
taxonkit = ">=0.15"                           # NCBI TaxID 转换
vcontact3 = ">=3.0"                           # 基因共享聚类
vitap = ">=1.0"                               # 病毒分类
acvirus = ">=1.0"                             # 病毒分类 (ACVirus)

# ==============================================================================
# 病毒聚类 / 宿主预测 (Stage 4/6)
# ==============================================================================
vclust = ">=1.0"                              # 病毒聚类去冗余
cd-hit = ">=4.8"                              # CD-HIT 参考引导预聚类
rnavirhost = ">=1.0"                          # RNA 病毒宿主预测 (用户修改版在 mambaforge)
# 注意: PhaBOX2/CHERRY 为 GitHub 手动安装 (bioconda 无包), 见文末手动安装区

# ==============================================================================
# COBRA 延伸 (Stage 3, 实际 = bwa-mem2 组装)
# ==============================================================================
samtools = ">=1.18"                           # BAM 处理
coverm = ">=0.6"                              # 覆盖度计算

# ==============================================================================
# 变异检测 & 注释 (Virome Analysis)
# ==============================================================================
bcftools = ">=1.18"                           # VCF 处理
freebayes = ">=1.3"                           # 变异检测
ivar = ">=1.4"                                # 病毒变异检测
lofreq = ">=2.1"                              # 低频变异检测
snpeff = ">=5.1"                              # 变异注释
# snpgenie 锁死 perl 5.22 与主环境冲突, 独立 env: conda create -n snpgenie snpgenie (shim snpgenie.pl 到 PATH)                            # 群体遗传 (dN/dS)
viral_consensus = ">=1.0"                     # 共识序列
htslib = ">=1.18"                              # (含 tabix) VCF 压缩索引

# ==============================================================================
# 系统发育 & 选择压力
# ==============================================================================
mafft = ">=7.5"                               # 多序列比对
iqtree = ">=2.3"                              # 系统发育树
hyphy = ">=2.5"                               # 正选择分析
cawlign = ">=0.1"                             # 密码子感知比对
ragtag = ">=2.1"                              # 参考引导 scaffolding

# ==============================================================================
# 定量 & 比对引擎
# ==============================================================================
salmon = ">=1.10"                             # 转录本定量
kallisto = ">=0.48"                           # 伪比对定量
bwa = ">=0.7"                                 # 短读段比对
bwa-mem2 = ">=2.2"
strobealign = ">=0.12"                        # 快速比对
# pandepth conda 无包, 手动源码安装 (panDepth, GitHub)                            # 位点深度
# virema bioconda 包要求 bowtie<=1.0 无法求解, DVG 用 biosoft/virema (ViReMa 0.29)                              # DVG/重组检测 (另: biosoft/ViReMa 手动版 ViReMa 0.29)
bowtie = ">=1.3"                              # bowtie v1 (batch_virema_dvg 比对)

# ==============================================================================
# SRA 公共数据获取
# ==============================================================================
sra-tools = ">=3.0"                           # prefetch, fasterq-dump
ncbi-datasets-cli = ">=16.0"                  # datasets 下载基因组
entrez-direct = ">=22.0"                      # esearch, efetch
aria2 = ">=1.36"                              # 并行下载
wget = ">=1.21"
curl = ">=8.0"
datavzrd = ">=2.0"                            # 交互式数据报告
multiqc = ">=1.20"                            # 汇总报告

# ==============================================================================
# 工具集
# ==============================================================================
pigz = ">=2.8"                                # 并行 gzip
gffread = ">=0.12"                            # GFF → GTF 转换

# ==============================================================================
# [feature] — 可选功能分组
# ==============================================================================

# --- 仅核心流程 (discovery) ---
[feature.discovery.dependencies]
fastp = ">=0.23"
seqkit = ">=2.6"
bbmap = ">=39.0"
bowtie2 = ">=2.5"
hisat2 = ">=2.2"
minimap2 = ">=2.24"
kraken2 = ">=2.1"
ribodetector = ">=0.3"
megahit = ">=1.2"
spades = ">=3.15"
diamond = ">=2.1"
blast = ">=2.15"
mmseqs2 = ">=14"
genomad = ">=1.7"
# virsorter bioconda 构建锁死旧 ruamel.yaml(py<3.10), 独立 env 部署: conda create -n vs2 virsorter=2.2.4
viralverify = ">=1.0"
# rdrpcatch 独立 env 部署 (代码用 conda run -n rdrpcatch): conda create -n rdrpcatch rdrpcatch
vcontact3 = ">=3.0"
vitap = ">=1.0"
acvirus = ">=1.0"
taxonkit = ">=0.15"
vclust = ">=1.0"
samtools = ">=1.18"
coverm = ">=0.6"
ragtag = ">=2.1"
salmon = ">=1.10"
kallisto = ">=0.48"
bwa = ">=0.7"
rnavirhost = ">=1.0"

# --- 仅分析流程 (analysis) ---
[feature.analysis.dependencies]
bcftools = ">=1.18"
freebayes = ">=1.3"
ivar = ">=1.4"
lofreq = ">=2.1"
snpeff = ">=5.1"
# snpgenie 锁死 perl 5.22 与主环境冲突, 独立 env: conda create -n snpgenie snpgenie (shim snpgenie.pl 到 PATH)
viral_consensus = ">=1.0"
htslib = ">=1.18"
mafft = ">=7.5"
iqtree = ">=2.3"
hyphy = ">=2.5"
cawlign = ">=0.1"
strobealign = ">=0.12"
samtools = ">=1.18"
bowtie2 = ">=2.5"
minimap2 = ">=2.24"
bwa = ">=0.7"
# pandepth conda 无包, 手动源码安装 (panDepth, GitHub)
# virema bioconda 包要求 bowtie<=1.0 无法求解, DVG 用 biosoft/virema (ViReMa 0.29)
drhip = ">=0.1"                               # DRHIP (capheine_pipeline.py)

# --- 仅公共数据 (public data) ---
[feature.publicdata.dependencies]
sra-tools = ">=3.0"
ncbi-datasets-cli = ">=16.0"
entrez-direct = ">=22.0"
aria2 = ">=1.36"
wget = ">=1.21"
curl = ">=8.0"
datavzrd = ">=2.0"
multiqc = ">=1.20"
kraken2 = ">=2.1"
bowtie2 = ">=2.5"
hisat2 = ">=2.2"
minimap2 = ">=2.24"
openai = ">=1.0"
urllib3 = ">=2.0"
xmltodict = ">=0.13"

# --- GPU 加速 (可选) ---
[feature.gpu.dependencies]
cuda-version = ">=12.0"
# diamond 和 mmseqs2 在 conda 中通常已含 GPU 支持

# ==============================================================================
# Task shortcuts
# ==============================================================================
[tasks]

# 快速运行发现流程 (从 assembly 开始, 跳过 clean+deplete)
discovery-downstream = { cmd = "python virome_discovery_pipeline/virome_pipeline.py --stage assembly identification cobra cluster taxonomy host checkv rescue report", description = "Run discovery pipeline downstream (skip clean+deplete)" }

# 运行已知病毒分析
analysis-detect = { cmd = "python virome_analysis_pipeline/auto_known_virus.py --stage detect", description = "Known virus rapid detection" }

# 转换 discovery → analysis
discovery2analysis = { cmd = "python virome_discovery_pipeline/utils/discovery2analysis.py", description = "Convert discovery centroids to analysis reference format" }

# 搜索公共 SRA 数据
public-search = { cmd = "python public_metadata_pipeline/public_data_pipeline.py --stage search", description = "Search SRA/GSA for a species" }

# 构建宿主数据库
build-hostdb = { cmd = "python public_metadata_pipeline/build_host_pipeline.py --stage hostdb", description = "Build Kraken2/Bowtie2/HISAT2/Minimap2 host DB" }

# 内源性病毒 (EVE) 三阶段筛查 (宿主基因组 FASTA 输入)
eve-screen = { cmd = "python endogenous_virus_pipeline/eve_screen.py", description = "EVE screening: discover→verdict→annotate→merge on host genomes" }

# EVE 核心逻辑单元测试 (本地无 diamond/seqkit 也可跑)
eve-test = { cmd = "python -m unittest discover -s endogenous_virus_pipeline/tests -v", description = "Run EVE core unit tests" }

# R 交互环境
R-shell = { cmd = "R --no-save", description = "Start R interactive session" }

# ==============================================================================
# 手动安装 (bioconda/conda-forge 无包, 见 DATABASE_SETUP.md 与 SOFTWARE_VERSIONS.txt)
# ==============================================================================
# penguin (PenguiN 组装器) — 官方源码自编译
#   版本 commit ac83d8fa, 位于 mambaforge/bin/penguin
#
# refineC (组装优化) — 源码编译, bioconda 无包
#
# flye — biosoft 源码版 2.9-b1779 (biosoft/Flye)
#
# PhaBOX2 (噬菌体宿主预测) — https://github.com/KennthShang/PhaBOX + phabox_db_v2_2
# CHERRY  (宿主预测)       — https://github.com/core-analytics/cherry
# VirHunter               — 独立 env: conda run -n virhunter + biosoft/virhunter/predict_cpu.py
# VirBot                  — biosoft/VirBot/VirBot.py (手动拷贝)
# ViraLM                  — 独立 env: conda env create -f envs/viralm.yaml -n viralm
#                           模型: gdown 1EQVPmFbpLGrBLU0xCtZBpwvXrtrRxic1 → ~/database/virus-db/viralm_db/
#
# VCF2Dis — 遗传距离矩阵
#   git clone https://github.com/hewm2008/VCF2Dis.git
#   cd VCF2Dis && make && chmod +x VCF2Dis && sudo cp VCF2Dis /usr/local/bin/
#
# VCF2PCACluster — PCA 聚类
#   git clone https://github.com/hewm2008/VCF2PCACluster.git
#   cd VCF2PCACluster && make && chmod +x VCF2PCACluster && sudo cp VCF2PCACluster /usr/local/bin/

# ==============================================================================
# 数据库 (运行时必需, 需预下载并配置路径, 见 pipeline_config.yaml)
# ==============================================================================
#   checkv-db         — https://bitbucket.org/berkeleylab/checkv/src/master/
#   genomad_db        — https://zenodo.org/records/14828026
#   RVDB              — https://fzer.github.io/rvdbtools/
#   nr (diamond)      — NCBI nr diamond 格式
#   ncbi-virus_ref    — NCBI virus reference genomes
#   host_db           — 宿主参考基因组索引
#   viralverify_hmm   — ViralVerify HMM models
#   virsorter_db      — VirSorter2 数据库
#   metabuli_db       — Metabuli 数据库
#   vcontact3_db      — vConTACT3 参考数据库
# ==============================================================================

# ==============================================================================
# 独立 conda 环境 (非 pixi 管理, 需手动创建)
# ==============================================================================
# ViraLM (PyTorch + CUDA 11.8, DNABERT-2 模型)
#   conda env create -f envs/viralm.yaml -n viralm
#   模型下载: gdown https://drive.google.com/uc?id=1EQVPmFbpLGrBLU0xCtZBpwvXrtrRxic1
#   解压模型到 viralm_db 目录

# ==============================================================================
# 部署步骤:
#   1. pixi install                    # 安装全部依赖
#   2. pixi install --feature gpu      # (可选) 加 GPU 支持
#   3. 下载并配置数据库 (见上方列表)
#   4. pixi shell                       # 进入环境
#   5. pixi run discovery-downstream    # 运行流程
# ==============================================================================

# ==============================================================================
# [environments] — 必须把 feature 挂进环境, 否则依赖不解析不安装 (pixi>=0.59 语义)
# ==============================================================================
[environments]
default = { features = ["discovery", "analysis", "publicdata"], solve-group = "default" }
gpu = { features = ["gpu"], solve-group = "default" }
