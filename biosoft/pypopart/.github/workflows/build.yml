name: Build
on:
  push:
    branches: [main, "refactor/**"]
    tags: ["v*"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs needs tags for versioning
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Smoke-test wheel in clean env
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "import pypopart; print(pypopart.__version__)"
          /tmp/smoke/bin/pypopart --help
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
